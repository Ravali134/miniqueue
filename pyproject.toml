[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniqueue"
version = "0.1.0"
description = "A tiny Celery-style task queue built from scratch: decorators, worker processes, retries, pluggable backends and a live dashboard."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
miniqueue = "miniqueue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
miniqueue = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
